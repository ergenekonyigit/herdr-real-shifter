[workspace]
resolver = "2"
members = [
    "crates/realshifter-core",
    "crates/realshifter-daemon",
    "crates/realshifter-tui",
    "crates/realshifter-action",
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
hidapi = "2.6.6"
