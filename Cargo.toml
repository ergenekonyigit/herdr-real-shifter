[workspace]
resolver = "2"
members = [
    "crates/realshifter-core",
    "crates/realshifter-daemon",
    "crates/realshifter-tui",
    "crates/realshifter-action",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
